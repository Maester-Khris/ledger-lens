[pytest]
markers =
    stress: end-to-end concurrency proof against a live uvicorn server (run with: pytest -m stress)
    slow: runs real Docling/Presidio models locally (deselect with: pytest -m "not slow")
    eval: golden-set evaluation against real OpenAI/Pinecone (run with: pytest -m eval)
    enable_tracing: keeps Langfuse tracing on (conftest turns it off for every other test)
# The deepeval pytest plugin loads backend/.env at startup, which overrides ENV_FILE; nothing here uses deepeval.
addopts = -m "not stress and not eval" -p no:deepeval
