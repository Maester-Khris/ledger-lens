# Round-robin over the API replicas; X-Upstream names the replica that answered (MediCoord pattern).
# X3: set up like a load balancer, not left at nginx's defaults, so the replica-loss run tests the app: "api" is
# re-resolved through Docker's DNS every 5 s (a replica restarted with a new address gets traffic again), a dead
# replica is skipped for 5 s after one failure, and a connect gives up after 2 s instead of 60 s. A connect failure
# goes to the next replica (the request never reached the first, so resending is safe); a busy 503 is not retried.
worker_processes 1;
events { worker_connections 4096; }
http {
  access_log off;
  resolver 127.0.0.11 valid=5s ipv6=off;
  upstream api {
    zone api 64k;
    server api:8000 resolve max_fails=1 fail_timeout=5s;
  }
  server {
    listen 80;
    location / {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_connect_timeout 2s;
      proxy_read_timeout 120s;
      proxy_buffering off;
      add_header X-Upstream $upstream_addr always;
    }
  }
}
