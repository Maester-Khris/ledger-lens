# Round-robin over the API replicas; X-Upstream names the replica that answered (MediCoord pattern). "api" resolves to
# one address per replica when nginx starts, so the stack is started with all replicas before nginx.
worker_processes 1;
events { worker_connections 1024; }
http {
  access_log off;
  upstream api { server api:8000; }
  server {
    listen 80;
    location / {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 120s;
      proxy_buffering off;
      add_header X-Upstream $upstream_addr always;
    }
  }
}
